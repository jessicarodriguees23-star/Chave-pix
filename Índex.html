<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pix</title>
<style>
body {
  margin: 0;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  background: #f5f1e8;
  font-family: Arial, sans-serif;
}
.box {
  background: white;
  padding: 35px 25px;
  border-radius: 20px;
  text-align: center;
  width: 80%;
  max-width: 400px;
  box-shadow: 0 5px 25px rgba(0,0,0,.12);
}
h1 {
  color: #234b3b;
}
p {
  color: #555;
}
button {
  border: none;
  background: #234b3b;
  color: white;
  padding: 16px 30px;
  border-radius: 12px;
  font-size: 18px;
  cursor: pointer;
}
</style>
</head>

<body>
<div class="box">
  <h1>Pagamento via Pix</h1>
  <p>Toque no botão abaixo para copiar a chave Pix.</p>

  <button onclick="copiarPix()">Copiar chave Pix</button>

  <p id="mensagem"></p>
</div>

<script>
function copiarPix() {
  const chave = "51996476325";
  navigator.clipboard.writeText(chave);
  document.getElementById("mensagem").innerText =
    "Chave Pix copiada! ❤️";
}
</script>

</body>
</html>
